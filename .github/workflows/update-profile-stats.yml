name: Update total contributions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-contributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate total contributions card
        uses: DenverCoder1/github-readme-streak-stats@a028da8aed0700a4d4cbe90f3482c2a2ee6188df
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&hide_current_streak=true&hide_longest_streak=true&disable_animations=true&card_width=320
          path: assets/profile/total-contributions.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/total-contributions.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update total contributions"
          git push
