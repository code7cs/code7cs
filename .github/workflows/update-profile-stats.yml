name: Update profile stats images

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download stats SVGs
        run: |
          mkdir -p assets/profile
          curl -fsSL "https://github-readme-stats.vercel.app/api?username=code7cs&show_icons=true&theme=tokyonight&hide_border=true" -o assets/profile/github-stats.svg
          curl -fsSL "https://github-readme-stats.vercel.app/api/top-langs/?username=code7cs&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" -o assets/profile/top-langs.svg
          curl -fsSL "https://github-profile-trophy.vercel.app/?username=code7cs&theme=discord&no-frame=true&column=4&margin-w=8&margin-h=8" -o assets/profile/trophies.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile/
          git diff --staged --quiet || git commit -m "chore: update profile stats SVGs"
          git push
